services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim
    container_name: edu-admin-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-edu_admin_sys}
      APP_USER: ${DB_USERNAME:-edu_admin}
      APP_USER_PASSWORD: ${DB_PASSWORD:-edu_admin}
    ports:
      # Só no localhost: o banco tem senhas padrão e não deve ficar exposto na rede.
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    volumes:
      - edu_admin_oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: edu-admin-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-edu_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-edu_admin_minio}
    ports:
      # Só no localhost: credenciais padrão não devem ficar expostas na rede.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - edu_admin_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    # Todo "docker compose up" reconstrói a imagem: depois de um git pull não há
    # como subir um jar antigo por esquecer o --build. Sem mudanças, o cache das
    # camadas deixa o build quase instantâneo.
    pull_policy: build
    container_name: edu-admin-api
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: ${DB_USERNAME:-edu_admin}
      DB_PASSWORD: ${DB_PASSWORD:-edu_admin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-em-ambiente-real}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-edu_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-edu_admin_minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-ticket-attachments}
    ports:
      - "${API_PORT:-8080}:8080"

  # Build e testes Java sem JDK no host: docker compose run --rm maven test|verify
  # O código entra read-only e é copiado para /build, então nada é escrito no host.
  # O socket do Docker permite ao Testcontainers criar o Oracle efêmero dos *IT
  # e dá a este container acesso equivalente a root no Docker do host.
  maven:
    image: maven:3.9.16-eclipse-temurin-21
    profiles: ["tools"]
    working_dir: /build
    entrypoint:
      - sh
      - -c
      - 'tar -C /src --exclude=./target --exclude=./data -cf - . | tar -xf - && exec mvn -B "$$@"'
      - mvn
    volumes:
      - ./:/src:ro
      - maven-repo:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Painel web (ng serve) sem Node no host. O código fica montado em /app, então
  # edições e git pull aparecem sozinhos no navegador; node_modules e o cache do
  # Angular ficam em volumes, fora da pasta do host. Dependências e configuração
  # novas também se aplicam sozinhas: veja web-angular/tool/dev-server.sh.
  web:
    image: node:24.21.0
    container_name: edu-admin-web
    restart: unless-stopped
    depends_on:
      - api
    working_dir: /app
    entrypoint: ["bash", "/app/tool/dev-server.sh"]
    environment:
      API_URL: http://api:8080
    volumes:
      - ../web-angular:/app
      - web-node-modules:/app/node_modules
      - web-angular-cache:/app/.angular
      - npm-cache:/root/.npm
    ports:
      # Só no localhost, como o Oracle e o MinIO.
      - "127.0.0.1:${WEB_PORT:-4200}:4200"

  # Testes e build do painel sem Node no host, no mesmo esquema do serviço maven:
  #   docker compose run --rm node test        (Vitest, uma vez)
  #   docker compose run --rm node run build   (build de produção, com os limites de tamanho)
  node:
    image: node:24.21.0
    profiles: ["tools"]
    working_dir: /build
    entrypoint:
      - bash
      - -c
      - 'set -euo pipefail; tar -C /src --exclude=node_modules --exclude=.angular --exclude=dist --exclude=e2e -cf - . | tar -xf -; npm ci --no-audit --no-fund; exec npm "$$@"'
      - npm
    volumes:
      - ../web-angular:/src:ro
      - npm-cache:/root/.npm

  # App Flutter sem Flutter no host, no mesmo esquema dos serviços maven e node:
  #   docker compose run --rm flutter analyze
  #   docker compose run --rm flutter test [caminhos]
  #   docker compose run --rm flutter apk              (mobile-flutter/dist/app-debug.apk)
  #   docker compose run --rm flutter lock             (atualiza o pubspec.lock)
  #   docker compose run --rm flutter format <arquivos>
  # O código entra read-only em /src; só apk, lock e format escrevem em /host.
  flutter:
    image: ghcr.io/cirruslabs/flutter:3.44.0
    profiles: ["tools"]
    entrypoint: ["bash", "/src/tool/container.sh"]
    volumes:
      - ../mobile-flutter:/src:ro
      - ../mobile-flutter:/host
      - edu-flutter-pub-cache:/root/.pub-cache
      - edu-flutter-gradle:/root/.gradle
      # Guarda a chave de debug do Android: sem ela, cada APK sai com outra
      # assinatura e o "adb install -r" recusa a atualização.
      - edu-flutter-android:/root/.android
      # O Gradle baixa NDK, plataformas e CMake no primeiro build; o volume
      # (iniciado com o SDK da imagem) evita baixar tudo de novo a cada APK.
      - edu-flutter-android-sdk:/opt/android-sdk-linux

volumes:
  edu_admin_oracle_data:
  edu_admin_minio_data:
  maven-repo:
  npm-cache:
  web-node-modules:
  web-angular-cache:
  # Nomes fixos: o e2e do app (mobile-flutter/e2e) usa os mesmos caches.
  edu-flutter-pub-cache:
    name: edu-flutter-pub-cache
  edu-flutter-gradle:
    name: edu-flutter-gradle
  edu-flutter-android:
    name: edu-flutter-android
  edu-flutter-android-sdk:
    name: edu-flutter-android-sdk

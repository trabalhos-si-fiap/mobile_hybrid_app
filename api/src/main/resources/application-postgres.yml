spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edu_admin}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:edu_admin}
    password: ${DB_PASSWORD:edu_admin}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  h2:
    console:
      enabled: false
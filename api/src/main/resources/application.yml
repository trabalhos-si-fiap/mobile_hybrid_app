spring:
  application:
    name: edu-admin-api

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:edu_admin}
    password: ${DB_PASSWORD:edu_admin}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/plsql
      - classpath:db/seed

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

  security:
    jwt-secret: ${JWT_SECRET:troque-esta-chave-em-ambiente-real}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

  storage:
    minio:
      url: ${MINIO_URL:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:edu_admin}
      secret-key: ${MINIO_SECRET_KEY:edu_admin_minio}
      bucket: ${MINIO_BUCKET:ticket-attachments}

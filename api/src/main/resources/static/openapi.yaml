openapi: 3.0.3

info:
  title: Edu Admin API
  version: 0.2.0
  description: |
    Contrato do MVP administrativo do Edu.
    A API reúne indicadores agregados educacionais,
    produtos/estoque, transportadoras e suas ocorrências.

    A API utiliza autenticação JWT.
    O endpoint de login gera um token Bearer que deve ser enviado
    no header Authorization nas rotas protegidas.

    A API usa Oracle Database Free 23ai como banco único e roda em
    container (docker compose up -d --build na pasta api/).

servers:
  - url: http://localhost:8080/api/v1
    description: Desenvolvimento local

security:
  - BearerAuth: []

tags:
  - name: Auth
  - name: Dashboard
  - name: Products
  - name: Inventory
  - name: Carriers
  - name: Carrier occurrences
  - name: Tickets
  - name: Atendimento
  - name: Notifications
  - name: Chatbot

paths:

  /auth/login:
    post:
      tags: [Auth]
      summary: Realiza login do administrador
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Retorna os indicadores do dashboard
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: Indicadores educacionais e operacionais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/omnichannel:
    get:
      tags: [Dashboard]
      summary: Resumo do atendimento omnichannel (PR_RESUMO_DASHBOARD)
      description: |
        Indicadores de tickets nos últimos N dias comparados aos N dias anteriores
        (variação pela FN_CALC_TAXA_VARIACAO), os mesmos por segmento e as anomalias
        de volume das últimas 24 horas (z-score contra as janelas de 24 horas dos 28
        dias anteriores). Só EMPLOYEE e ADMIN.
      operationId: getOmnichannelDashboard
      parameters:
        - $ref: '#/components/parameters/PeriodDays'
      responses:
        '200':
          description: Resumo do atendimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmnichannelDashboardResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /products:
    get:
      tags: [Products]
      summary: Lista produtos
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Products]
      summary: Cadastra um produto e seu estoque inicial
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    get:
      tags: [Products]
      summary: Consulta um produto
      operationId: getProduct
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Products]
      summary: Atualiza um produto
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory:
    get:
      tags: [Inventory]
      summary: Lista a posição atual do estoque
      operationId: listInventory
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
        - name: lowStock
          in: query
          description: |
            Quando true, retorna somente produtos com estoque
            abaixo ou igual ao estoque mínimo.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Página de itens de estoque
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /inventory/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    patch:
      tags: [Inventory]
      summary: Ajusta a quantidade de estoque
      operationId: adjustInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustInventoryRequest'
      responses:
        '200':
          description: Estoque atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /carriers:
    get:
      tags: [Carriers]
      summary: Lista transportadoras
      operationId: listCarriers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CarrierStatus'
      responses:
        '200':
          description: Página de transportadoras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Carriers]
      summary: Cadastra uma transportadora
      operationId: createCarrier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierRequest'
      responses:
        '201':
          description: Transportadora criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrier'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /carriers/{carrierId}:
    parameters:
      - $ref: '#/components/parameters/CarrierId'

    get:
      tags: [Carriers]
      summary: Consulta uma transportadora
      operationId: getCarrier
      responses:
        '200':
          description: Transportadora encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrier'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Carriers]
      summary: Atualiza uma transportadora
      operationId: updateCarrier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierRequest'
      responses:
        '200':
          description: Transportadora atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrier'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /carriers/{carrierId}/status:
    parameters:
      - $ref: '#/components/parameters/CarrierId'

    patch:
      tags: [Carriers]
      summary: Atualiza o status da transportadora
      operationId: updateCarrierStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/CarrierStatus'
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrier'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /carrier-occurrences:
    get:
      tags: [Carrier occurrences]
      summary: Lista ocorrências de transportadoras
      operationId: listCarrierOccurrences
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: carrierId
          in: query
          schema:
            type: integer
            format: int64
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/OccurrenceType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OccurrenceStatus'
      responses:
        '200':
          description: Página de ocorrências
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrencePage'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Carrier occurrences]
      summary: Registra uma ocorrência
      operationId: createCarrierOccurrence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOccurrenceRequest'
      responses:
        '201':
          description: Ocorrência criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierOccurrence'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /carrier-occurrences/{occurrenceId}:
    parameters:
      - $ref: '#/components/parameters/OccurrenceId'

    get:
      tags: [Carrier occurrences]
      summary: Consulta uma ocorrência
      operationId: getCarrierOccurrence
      responses:
        '200':
          description: Ocorrência encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierOccurrence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /carrier-occurrences/{occurrenceId}/status:
    parameters:
      - $ref: '#/components/parameters/OccurrenceId'

    patch:
      tags: [Carrier occurrences]
      summary: Atualiza o status de uma ocorrência
      operationId: updateCarrierOccurrenceStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/OccurrenceStatus'
      responses:
        '200':
          description: Ocorrência atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierOccurrence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /segments:
    get:
      tags: [Tickets]
      summary: Lista a matriz de triagem ativa (opções do formulário de ticket)
      operationId: listSegments
      responses:
        '200':
          description: Segmentos ativos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tickets:
    post:
      tags: [Tickets]
      summary: Abre um ticket; a PR_ROTEAR_TICKET atribui ao atendente online da skill
      operationId: openTicket
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [segment, description]
              properties:
                segment:
                  $ref: '#/components/schemas/Segment'
                description:
                  type: string
                  maxLength: 2000
                chatbotConversationId:
                  type: integer
                  format: int64
                  description: Conversa do Mentor Edu em ENCAMINHAMENTO; o ticket nasce com o canal CHATBOT_IA e a conversa fica ligada a ele
                files:
                  type: array
                  maxItems: 5
                  description: PNG, JPEG, WEBP ou PDF, até 5 MB cada
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Ticket aberto e roteado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /tickets/mine:
    get:
      tags: [Tickets]
      summary: Tickets do usuário autenticado, mais recentes primeiro
      operationId: listMyTickets
      responses:
        '200':
          description: Tickets do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tickets/queue:
    get:
      tags: [Atendimento]
      summary: Fila do console, ordenada por prioridade e prazo (EMPLOYEE/ADMIN)
      operationId: listQueue
      parameters:
        - name: scope
          in: query
          description: mine = atribuídos a mim; skills = filas das minhas skills; all = todos (só ADMIN)
          schema:
            type: string
            enum: [mine, skills, all]
            default: mine
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
      responses:
        '200':
          description: Tickets da fila
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSummaryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: Detalhe do ticket (dono ou atendente com acesso)
      operationId: getTicket
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{ticketId}/messages:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: Mensagens do ticket em ordem cronológica
      operationId: listTicketMessages
      responses:
        '200':
          description: Mensagens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tickets]
      summary: Envia mensagem (usuário em qualquer estado exceto FECHADO; atendente só EM_ATENDIMENTO)
      operationId: postTicketMessage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 2000
                files:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Mensagem enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tickets/{ticketId}/chatbot-conversation:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: Conversa com o Mentor Edu que originou o ticket (mesma visibilidade do detalhe)
      operationId: getTicketChatbotConversation
      responses:
        '200':
          description: Transcrição em ordem cronológica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotTranscriptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{ticketId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Tickets]
      summary: Baixa um anexo (servido pela API, com checagem de acesso)
      operationId: downloadAttachment
      responses:
        '200':
          description: Conteúdo do arquivo
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{ticketId}/confirm:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      summary: Usuário confirma a solução (RESOLVIDO → FECHADO)
      operationId: confirmTicket
      responses:
        '200':
          description: Ticket fechado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tickets/{ticketId}/reopen:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      summary: Usuário reabre (RESOLVIDO → EM_ATENDIMENTO, mesmo atendente, prazo novo)
      operationId: reopenTicket
      responses:
        '200':
          description: Ticket reaberto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tickets/{ticketId}/events:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Atendimento]
      summary: Linha do tempo do ticket (ticket_events)
      operationId: listTicketEvents
      responses:
        '200':
          description: Eventos em ordem cronológica
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketEventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{ticketId}/assume:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Atendimento]
      summary: Atendente assume (EM_FILA/ESCALADO → EM_ATENDIMENTO)
      operationId: assumeTicket
      responses:
        '200':
          description: Ticket em atendimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tickets/{ticketId}/resolve:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Atendimento]
      summary: Atendente encerra (EM_ATENDIMENTO → RESOLVIDO)
      operationId: resolveTicket
      responses:
        '200':
          description: Ticket resolvido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tickets/{ticketId}/transfer:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Atendimento]
      summary: Transfere para outra skill e reroteia
      operationId: transferTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Ticket transferido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /tickets/{ticketId}/engineering-alert:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Atendimento]
      summary: Marca o ticket e notifica a equipe de engenharia (skill DESENVOLVEDOR)
      operationId: raiseEngineeringAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineeringAlertRequest'
      responses:
        '200':
          description: Alerta registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /employees/me:
    get:
      tags: [Atendimento]
      summary: Cadastro de atendente do usuário autenticado (presença e skills)
      operationId: getMyEmployeeProfile
      responses:
        '200':
          description: Atendente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /employees/me/presence:
    put:
      tags: [Atendimento]
      summary: Altera a presença; ONLINE puxa a fila, AUSENTE/OFFLINE devolve o que não foi assumido
      operationId: changeMyPresence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceRequest'
      responses:
        '200':
          description: Presença alterada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeMeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications:
    get:
      tags: [Notifications]
      summary: Notificações do usuário (máx. 50, mais recentes primeiro); usada no polling do app
      operationId: listNotifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Notificações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Notifications]
      summary: Marca uma notificação como lida
      operationId: markNotificationRead
      responses:
        '204':
          description: Marcada como lida
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Marca todas as notificações do usuário como lidas
      operationId: markAllNotificationsRead
      responses:
        '204':
          description: Todas marcadas como lidas
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chatbot/conversations:
    post:
      tags: [Chatbot]
      summary: Inicia uma conversa com o Mentor Edu (chatbot nível 0); qualquer usuário autenticado
      operationId: startChatbotConversation
      responses:
        '201':
          description: Saudação do bot e as opções do menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotTurnResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chatbot/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Chatbot]
      summary: Envia um texto ou uma opção; devolve a mensagem do usuário, as respostas do bot e as novas opções
      operationId: replyToChatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotReplyRequest'
      responses:
        '200':
          description: Turno do bot; na passagem para o atendente, state ENCAMINHAMENTO, sem opções e com handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotTurnResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:

  securitySchemes:

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Informe o token JWT obtido através do endpoint de login.
        O Swagger adicionará automaticamente o prefixo "Bearer".

  parameters:

    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    Search:
      name: search
      in: query
      schema:
        type: string

    Days:
      name: days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30

    PeriodDays:
      name: days
      in: query
      description: Tamanho do período, em dias
      schema:
        type: integer
        enum: [7, 30, 90]
        default: 7

    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    CarrierId:
      name: carrierId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    OccurrenceId:
      name: occurrenceId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:

    Forbidden:
      description: Papel sem acesso ao recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Transição de estado inválida para o ticket ou a conversa do chatbot
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unprocessable:
      description: Segmento sem configuração ativa na matriz de triagem
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@edu.com

        password:
          type: string
          format: password
          example: admin123

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Token JWT utilizado para autenticar as requisições.
          example: eyJhbGciOiJIUzI1NiJ9...

        tokenType:
          type: string
          example: Bearer

        user:
          $ref: '#/components/schemas/AuthUser'

    AuthUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1

        name:
          type: string
          example: Administrador Edu

        email:
          type: string
          format: email
          example: admin@edu.com

        role:
          type: string
          example: ADMIN

    DashboardResponse:
      type: object
      properties:

        educational:
          type: object
          properties:
            registeredStudents:
              type: integer
              example: 128

            activeStudents:
              type: integer
              example: 84

            newRegistrations:
              type: integer
              example: 12

            inactiveRiskStudents:
              type: integer
              example: 9

            activityHistory:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                    example: "2026-08-20"

                  studyActivities:
                    type: integer
                    example: 51

                  newRegistrations:
                    type: integer
                    example: 4

        operational:
          type: object
          properties:

            registeredProducts:
              type: integer
              example: 1

            lowStockProducts:
              type: integer
              example: 1

            activeCarriers:
              type: integer
              example: 1

            openOccurrences:
              type: integer
              example: 1

            lowStock:
              type: array
              items:
                $ref: '#/components/schemas/LowStockProduct'

            carriers:
              type: array
              items:
                $ref: '#/components/schemas/DashboardCarrier'

            recentOccurrences:
              type: array
              items:
                $ref: '#/components/schemas/RecentOccurrence'

        executiveSummary:
          type: string
          example: |
            66% dos alunos estiveram ativos no período.
            9 alunos apresentam risco de inatividade.
            Há 1 produtos abaixo do estoque mínimo.
            1 ocorrências estão abertas.

    LowStockProduct:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        sku:
          type: string
        currentQuantity:
          type: integer
        minimumStock:
          type: integer
        status:
          type: string
          enum:
            - NORMAL
            - LOW_STOCK
            - OUT_OF_STOCK

    DashboardCarrier:
      type: object
      properties:
        carrierId:
          type: integer
          format: int64
        name:
          type: string
        rating:
          type: number
          format: double
          example: 4.5
        slaPercentage:
          type: number
          format: double
          example: 95.50
        averageDeliveryDays:
          type: integer
          example: 3

    RecentOccurrence:
      type: object
      properties:
        occurrenceId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/OccurrenceType'
        carrierName:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/OccurrenceStatus'

    MetricComparison:
      type: object
      description: Valor no período, no período anterior e a variação percentual (FN_CALC_TAXA_VARIACAO)
      properties:
        current:
          type: number
          nullable: true
          example: 31
        previous:
          type: number
          nullable: true
          example: 24
        variation:
          type: number
          nullable: true
          description: Nula quando o período anterior é 0 ou não tem valor
          example: 29.2

    ChannelComparison:
      type: object
      properties:
        app:
          $ref: '#/components/schemas/MetricComparison'
        chatbot:
          $ref: '#/components/schemas/MetricComparison'

    OmnichannelKpis:
      type: object
      properties:
        opened:
          $ref: '#/components/schemas/MetricComparison'
        resolved:
          $ref: '#/components/schemas/MetricComparison'
        backlog:
          type: integer
          description: Tickets não resolvidos agora (foto do momento, sem comparação)
          example: 6
        slaMetPercentage:
          $ref: '#/components/schemas/MetricComparison'
        escalated:
          $ref: '#/components/schemas/MetricComparison'
        averageMinutesToAssume:
          $ref: '#/components/schemas/MetricComparison'
        averageHoursToResolve:
          $ref: '#/components/schemas/MetricComparison'
        openedByChannel:
          $ref: '#/components/schemas/ChannelComparison'

    SegmentSummary:
      type: object
      properties:
        segment:
          $ref: '#/components/schemas/Segment'
        label:
          type: string
          example: Problemas com pedido
        opened:
          $ref: '#/components/schemas/MetricComparison'
        resolved:
          $ref: '#/components/schemas/MetricComparison'
        slaMetPercentage:
          $ref: '#/components/schemas/MetricComparison'
        backlog:
          type: integer
          example: 2

    SegmentAnomaly:
      type: object
      properties:
        segment:
          $ref: '#/components/schemas/Segment'
        label:
          type: string
          example: Problemas com pedido
        last24h:
          type: integer
          description: Tickets abertos nas últimas 24 horas
          example: 12
        mean:
          type: number
          nullable: true
          example: 3.4
        standardDeviation:
          type: number
          nullable: true
          example: 1.1
        zScore:
          type: number
          nullable: true
          example: 7.82
        status:
          type: string
          enum: [NORMAL, ANOMALIA, SEM_HISTORICO]
        direction:
          type: string
          enum: [PICO, QUEDA]
          nullable: true
        windows:
          type: integer
          description: Janelas de 24 horas de histórico usadas (SEM_HISTORICO abaixo de 7)
          example: 28

    OmnichannelDashboardResponse:
      type: object
      properties:
        days:
          type: integer
          enum: [7, 30, 90]
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        kpis:
          $ref: '#/components/schemas/OmnichannelKpis'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SegmentSummary'
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/SegmentAnomaly'
        highlights:
          type: array
          items:
            type: string
          example:
            - 'Pico de tickets em Problemas com pedido: 12 nas últimas 24h, contra média de 3,4.'

    CreateProductRequest:
      type: object
      required:
        - name
        - sku
        - minimumStock
        - initialQuantity
      properties:

        name:
          type: string
          maxLength: 150
          example: Caderno Universitário Premium

        sku:
          type: string
          maxLength: 60
          example: EDU-BB2A7DF0

        description:
          type: string
          maxLength: 500
          example: Caderno universitário premium

        minimumStock:
          type: integer
          minimum: 0
          example: 5

        initialQuantity:
          type: integer
          minimum: 0
          example: 20

        price:
          type: number
          format: double
          minimum: 0
          example: 29.90

    UpdateProductRequest:
      type: object
      required:
        - name
        - sku
        - minimumStock
        - active
      properties:

        name:
          type: string
          maxLength: 150

        sku:
          type: string
          maxLength: 60

        description:
          type: string
          maxLength: 500

        minimumStock:
          type: integer
          minimum: 0

        active:
          type: boolean

        price:
          type: number
          format: double
          minimum: 0

    Product:
      type: object
      properties:

        id:
          type: integer
          format: int64

        name:
          type: string

        sku:
          type: string

        description:
          type: string

        minimumStock:
          type: integer

        active:
          type: boolean

        price:
          type: number
          format: double
          example: 29.90

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    InventoryItem:
      type: object
      properties:

        productId:
          type: integer
          format: int64

        productName:
          type: string

        sku:
          type: string

        quantity:
          type: integer

        minimumStock:
          type: integer

        status:
          type: string
          enum:
            - NORMAL
            - LOW_STOCK
            - OUT_OF_STOCK

        updatedAt:
          type: string
          format: date-time

    AdjustInventoryRequest:
      type: object
      required:
        - quantity
        - reason
      properties:

        quantity:
          type: integer
          minimum: 0
          example: 20

        reason:
          type: string
          minLength: 3
          maxLength: 300
          example: Reposição de estoque

    CarrierStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    CarrierRequest:
      type: object
      required:
        - name
        - location
        - email
        - averageDeliveryDays
        - rating
        - slaPercentage
        - status
      properties:

        name:
          type: string
          example: EduLog Transportes

        location:
          type: string
          example: São Paulo - SP

        email:
          type: string
          format: email
          example: contato@edulog.com

        averageDeliveryDays:
          type: integer
          minimum: 1
          example: 3

        rating:
          type: number
          format: double
          minimum: 0
          maximum: 5
          example: 4.5

        slaPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          example: 95.50

        status:
          $ref: '#/components/schemas/CarrierStatus'

    Carrier:
      allOf:
        - $ref: '#/components/schemas/CarrierRequest'
        - type: object
          properties:

            id:
              type: integer
              format: int64

            createdAt:
              type: string
              format: date-time

            updatedAt:
              type: string
              format: date-time

    OccurrenceType:
      type: string
      enum:
        - DELIVERY_DELAY
        - DAMAGE
        - DELIVERY_FAILURE
        - OTHER

    OccurrenceStatus:
      type: string
      enum:
        - OPEN
        - RESOLVED

    CreateOccurrenceRequest:
      type: object
      required:
        - carrierId
        - type
        - description
      properties:

        carrierId:
          type: integer
          format: int64
          example: 1

        type:
          $ref: '#/components/schemas/OccurrenceType'

        description:
          type: string
          minLength: 3
          maxLength: 500
          example: Entrega atrasada em dois dias.

    CarrierOccurrence:
      type: object
      properties:

        id:
          type: integer
          format: int64

        carrierId:
          type: integer
          format: int64

        carrierName:
          type: string

        type:
          $ref: '#/components/schemas/OccurrenceType'

        description:
          type: string

        status:
          $ref: '#/components/schemas/OccurrenceStatus'

        createdAt:
          type: string
          format: date-time

        resolvedAt:
          type: string
          format: date-time
          nullable: true

    ProductPage:
      type: object
      properties:

        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'

        page:
          type: integer

        size:
          type: integer

        totalElements:
          type: integer
          format: int64

        totalPages:
          type: integer

    InventoryPage:
      type: object
      properties:

        content:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'

        page:
          type: integer

        size:
          type: integer

        totalElements:
          type: integer
          format: int64

        totalPages:
          type: integer

    CarrierPage:
      type: object
      properties:

        content:
          type: array
          items:
            $ref: '#/components/schemas/Carrier'

        page:
          type: integer

        size:
          type: integer

        totalElements:
          type: integer
          format: int64

        totalPages:
          type: integer

    OccurrencePage:
      type: object
      properties:

        content:
          type: array
          items:
            $ref: '#/components/schemas/CarrierOccurrence'

        page:
          type: integer

        size:
          type: integer

        totalElements:
          type: integer
          format: int64

        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Dados inválidos.
        path:
          type: string
          example: /api/v1/products


    Segment:
      type: string
      enum: [DEFEITO_APP, PROBLEMA_PEDIDO, FEEDBACK_SUGESTAO]

    TicketStatus:
      type: string
      enum: [ABERTO, EM_FILA, EM_ATENDIMENTO, ESCALADO, RESOLVIDO, FECHADO]

    TicketPriority:
      type: string
      enum: [NORMAL, ALTA, CRITICA]

    SlaStatus:
      type: string
      description: Calculado pela FN_STATUS_SLA_TICKET
      enum: [NO_PRAZO, EM_RISCO, ESTOURADO, CUMPRIDO, VIOLADO]

    Presence:
      type: string
      enum: [ONLINE, AUSENTE, OFFLINE]

    SegmentResponse:
      type: object
      properties:
        segment:
          $ref: '#/components/schemas/Segment'
        label:
          type: string
        queue:
          type: string
          enum: [TECNOLOGIA, MARKETPLACE, PRODUTO]
        skill:
          type: string
        slaMinutes:
          type: integer

    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string

    EmployeeSummary:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    AttachmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        downloadPath:
          type: string
          description: Caminho relativo à base da API, ex. /tickets/7/attachments/3

    TicketSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        segment:
          $ref: '#/components/schemas/Segment'
        segmentLabel:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        slaStatus:
          $ref: '#/components/schemas/SlaStatus'
        slaDueAt:
          type: string
          format: date-time
          nullable: true
        requesterName:
          type: string
        assigneeName:
          type: string
          nullable: true
        engineeringAlert:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TicketDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        segment:
          $ref: '#/components/schemas/Segment'
        segmentLabel:
          type: string
        queue:
          type: string
          enum: [TECNOLOGIA, MARKETPLACE, PRODUTO]
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        channel:
          type: string
          enum: [APP, CHATBOT_IA]
        description:
          type: string
        slaStatus:
          $ref: '#/components/schemas/SlaStatus'
        slaDueAt:
          type: string
          format: date-time
          nullable: true
        requester:
          $ref: '#/components/schemas/UserSummary'
        assignee:
          $ref: '#/components/schemas/EmployeeSummary'
        engineeringAlert:
          type: boolean
        engineeringAlertReason:
          type: string
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        assumedAt:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true

    MessageResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        senderType:
          type: string
          enum: [USER, EMPLOYEE, SYSTEM]
        senderName:
          type: string
        body:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentResponse'
        createdAt:
          type: string
          format: date-time

    TicketEventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [ABERTO, ROTEADO, ASSUMIDO, TRANSFERIDO, ESCALADO, RESOLVIDO, REABERTO, FECHADO, ALERTA_ENGENHARIA, ERRO_ESCALONAMENTO]
        fromStatus:
          $ref: '#/components/schemas/TicketStatus'
        toStatus:
          $ref: '#/components/schemas/TicketStatus'
        employeeName:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    TransferRequest:
      type: object
      required: [segment]
      properties:
        segment:
          $ref: '#/components/schemas/Segment'

    EngineeringAlertRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500

    PresenceRequest:
      type: object
      required: [presence]
      properties:
        presence:
          $ref: '#/components/schemas/Presence'

    EmployeeMeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        presence:
          $ref: '#/components/schemas/Presence'
        presenceChangedAt:
          type: string
          format: date-time
        skills:
          type: array
          items:
            type: string

    NotificationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ticketId:
          type: integer
          format: int64
          nullable: true
        type:
          type: string
          enum: [TICKET_ATRIBUIDO, TICKET_ASSUMIDO, NOVA_MENSAGEM, TICKET_RESOLVIDO, TICKET_ESCALADO, ALERTA_ENGENHARIA, TICKET_FECHADO]
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ChatbotState:
      type: string
      description: INICIO, SEGMENTO e CONFIRMACAO aceitam mensagens; ENCAMINHAMENTO espera o ticket; RESOLVIDA e ENCAMINHADA são finais
      enum: [INICIO, SEGMENTO, CONFIRMACAO, ENCAMINHAMENTO, RESOLVIDA, ENCAMINHADA]

    ChatbotMessageResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sender:
          type: string
          enum: [BOT, USER]
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    ChatbotOptionResponse:
      type: object
      properties:
        id:
          type: string
          description: segment:<SEGMENTO>, faq:<id>, menu, human, resolved ou not_resolved
          example: segment:PROBLEMA_PEDIDO
        label:
          type: string
          example: Problemas com pedido

    ChatbotHandoffResponse:
      type: object
      nullable: true
      description: Rascunho do ticket na passagem para o atendente (só no estado ENCAMINHAMENTO)
      properties:
        segment:
          type: string
          enum: [DEFEITO_APP, PROBLEMA_PEDIDO, FEEDBACK_SUGESTAO]
          nullable: true
        description:
          type: string
          maxLength: 2000
          description: 'Os textos digitados, um por linha; sem nenhum, "Dúvida: " e a pergunta do FAQ; ou vazio'

    ChatbotTurnResponse:
      type: object
      properties:
        conversationId:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/ChatbotState'
        messages:
          type: array
          description: A mensagem do usuário (ausente no início da conversa) seguida das respostas do bot
          items:
            $ref: '#/components/schemas/ChatbotMessageResponse'
        options:
          type: array
          items:
            $ref: '#/components/schemas/ChatbotOptionResponse'
        handoff:
          $ref: '#/components/schemas/ChatbotHandoffResponse'

    ChatbotReplyRequest:
      type: object
      description: Exatamente um dos dois campos
      properties:
        text:
          type: string
          maxLength: 500
        optionId:
          type: string
          example: human

    ChatbotTranscriptResponse:
      type: object
      properties:
        conversationId:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatbotMessageResponse'

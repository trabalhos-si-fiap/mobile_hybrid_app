<section class="login-page">
  <div class="login-left">
    <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
      <header class="login-header">
        <h1>EduAdmin</h1>
        <p>Bem-vindo(a) de volta! Acesse sua conta.</p>
      </header>

      <div class="field">
        <label for="email">E-MAIL</label>

        <div class="input-shell">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h16v14H4z"></path>
            <path d="m4 7 8 6 8-6"></path>
          </svg>

          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="seu@email.com.br"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="field">
        <div class="label-line">
          <label for="password">SENHA</label>
          <button class="forgot" type="button">Esqueci minha senha</button>
        </div>

        <div class="input-shell">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="10" width="14" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            <path d="M12 14v3"></path>
          </svg>

          <input
            id="password"
            [type]="passwordVisible ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />

          <button
            class="eye"
            type="button"
            aria-label="Mostrar ou ocultar senha"
            (click)="passwordVisible = !passwordVisible"
          >
            @if (passwordVisible) {
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.6A2 2 0 0 0 13.4 13.4"></path>
                <path d="M9.9 5.2A11.8 11.8 0 0 1 12 5c6.5 0 10 7 10 7a17.5 17.5 0 0 1-2.2 3.1"></path>
                <path d="M6.2 6.2C3.4 8 2 12 2 12s3.5 7 10 7a10.9 10.9 0 0 0 4-.7"></path>
              </svg>
            }
          </button>
        </div>
      </div>

      <label class="remember">
        <input type="checkbox" formControlName="remember" />
        <span>Lembrar acesso</span>
      </label>

      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      <button class="submit-button" type="submit" [disabled]="loading">
        <span>{{ loading ? 'Entrando...' : 'Entrar' }}</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h13"></path>
          <path d="m14 7 5 5-5 5"></path>
        </svg>
      </button>
    </form>
  </div>

  <div class="login-art" aria-hidden="true"></div>
</section>
